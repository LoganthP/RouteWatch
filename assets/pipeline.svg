<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Animated data flow: Browser to API to MongoDB and ML service" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="220" rx="16" fill="#0b1220"/>
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="30" y="70" width="190" height="80" rx="14" fill="url(#n)" stroke="#38bdf8" stroke-width="2"/>
      <text x="125" y="105" fill="#7dd3fc" font-size="18" font-weight="700">React + Vite</text>
      <text x="125" y="128" fill="#94a3b8" font-size="13">Leaflet · Recharts</text>
    </g>
    <g>
      <rect x="310" y="70" width="190" height="80" rx="14" fill="url(#n)" stroke="#34d399" stroke-width="2"/>
      <text x="405" y="105" fill="#6ee7b7" font-size="18" font-weight="700">Node + Express</text>
      <text x="405" y="128" fill="#94a3b8" font-size="13">REST · Socket.IO</text>
    </g>
    <g>
      <rect x="640" y="20" width="190" height="70" rx="14" fill="url(#n)" stroke="#22c55e" stroke-width="2"/>
      <text x="735" y="53" fill="#86efac" font-size="18" font-weight="700">MongoDB</text>
      <text x="735" y="75" fill="#94a3b8" font-size="13">2dsphere · aggregation</text>
    </g>
    <g>
      <rect x="640" y="130" width="190" height="70" rx="14" fill="url(#n)" stroke="#f472b6" stroke-width="2"/>
      <text x="735" y="163" fill="#f9a8d4" font-size="18" font-weight="700">FastAPI ML</text>
      <text x="735" y="185" fill="#94a3b8" font-size="13">scikit-learn · statsmodels</text>
    </g>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)">
    <path id="p1" d="M220 110 H308"/>
    <path id="p2" d="M500 100 C 570 100, 570 55, 638 55"/>
    <path id="p3" d="M500 120 C 570 120, 570 165, 638 165"/>
  </g>
  <g fill="#fbbf24">
    <circle r="5"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0.4s"><mpath href="#p2"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0.9s"><mpath href="#p3"/></animateMotion></circle>
  </g>
</svg>
