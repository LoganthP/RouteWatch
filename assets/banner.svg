<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="RouteWatch 2.0 animated banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>

  <!-- road network -->
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
    <path d="M0 220 C 150 180, 250 260, 400 210 S 650 130, 820 190 S 960 220, 1000 200"/>
    <path d="M120 0 C 160 90, 120 160, 200 300"/>
    <path d="M620 0 C 600 80, 700 150, 680 300"/>
    <path d="M860 0 C 830 70, 900 140, 880 300"/>
  </g>
  <path d="M0 220 C 150 180, 250 260, 400 210 S 650 130, 820 190 S 960 220, 1000 200"
        fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="14 18" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="64" to="0" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- incident hotspots -->
  <g>
    <circle cx="190" cy="205" r="46" fill="url(#glow)">
      <animate attributeName="r" values="26;56;26" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="205" r="6" fill="#f43f5e"/>
    <circle cx="690" cy="160" r="46" fill="url(#glow)">
      <animate attributeName="r" values="30;62;30" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="690" cy="160" r="6" fill="#f43f5e"/>
    <circle cx="880" cy="215" r="40" fill="url(#glow)">
      <animate attributeName="r" values="20;48;20" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="215" r="5" fill="#fb923c"/>
  </g>

  <!-- radar sweep -->
  <g transform="translate(860 70)">
    <circle r="42" fill="none" stroke="#38bdf8" stroke-opacity="0.5"/>
    <circle r="26" fill="none" stroke="#38bdf8" stroke-opacity="0.35"/>
    <circle r="10" fill="none" stroke="#38bdf8" stroke-opacity="0.25"/>
    <path d="M0 0 L42 0 A42 42 0 0 0 30 -29 Z" fill="#38bdf8" fill-opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- title -->
  <text x="60" y="130" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#title)">RouteWatch 2.0</text>
  <text x="62" y="170" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#e2e8f0">AI-Enabled Geospatial Traffic Incident Monitoring</text>
  <text x="62" y="198" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">and Hotspot Analytics System</text>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="62" y="226" width="92" height="28" rx="14" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8"/>
    <text x="108" y="245" text-anchor="middle" fill="#7dd3fc">MongoDB</text>
    <rect x="166" y="226" width="92" height="28" rx="14" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa"/>
    <text x="212" y="245" text-anchor="middle" fill="#c4b5fd">DBSCAN</text>
    <rect x="270" y="226" width="120" height="28" rx="14" fill="#f472b6" fill-opacity="0.18" stroke="#f472b6"/>
    <text x="330" y="245" text-anchor="middle" fill="#f9a8d4">Random Forest</text>
    <rect x="402" y="226" width="110" height="28" rx="14" fill="#34d399" fill-opacity="0.18" stroke="#34d399"/>
    <text x="457" y="245" text-anchor="middle" fill="#6ee7b7">Forecasting</text>
  </g>
</svg>
